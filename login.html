<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Área Administrativa</title>
    <link rel="icon" type="image/svg" href="./recursos/identidade/logo.svg">
    <link rel="shortcut icon" href="./recursos/identidade/logo.svg">
    <link rel="apple-touch-icon" href="./recursos/identidade/logo.svg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.26.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css">
    <script src="./src/config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: rgb(238, 238, 238);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        main {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(158, 103, 142, 0.198);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        main img {
            width: 240px;
            padding: 10px;
            margin-bottom: 20px;
        }

        main h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.8em;
        }

        main p {
            font-size: 0.95em;
            color: #666;
            margin-bottom: 30px;
        }

        main input {
            display: block;
            margin: 15px auto;
            padding: 12px;
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        main input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        .password-container {
            position: relative;
            margin: 15px auto;
            width: 100%;
        }

        .password-container input {
            margin: 0;
            padding-right: 45px;
            width: 100%;
        }

        .password-toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2em;
            color: #666;
            transition: all 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
        }

        .password-toggle-btn:active {
            transform: translateY(-50%) scale(0.95);
        }

        .password-toggle-btn i {
            transition: transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
        }

        .password-toggle-btn.hidden i {
            animation: blink 0.4s ease-in-out;
        }

        .input-label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 20px auto 8px;
            font-size: 0.95em;
            color: #333;
            font-weight: 500;
            width: 100%;
        }

        .input-label i {
            font-size: 1.1em;
            color: #616161;
            transition: all 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
        }

        main .button-entrar {
            display: block;
            width: 100%;
            margin: 25px auto 15px;
            padding: 12px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.1s;
        }

        main .button-entrar:hover {
            background-color: #0056b3;
        }

        main .button-entrar:active {
            transform: scale(0.98);
        }

        main .button-entrar:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .login-error {
            color: #e74c3c;
            font-size: 0.9em;
            margin-top: 10px;
            display: none;
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
                transform: rotateY(0deg);
            }

            50% {
                opacity: 0.5;
                transform: rotateY(90deg);
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <main>
            <img src="recursos/identidade/Screenshot_20260616_191620_Instagram.jpg" alt="" id="userIcon">
            <h1>Área Administrativa</h1>
            <p>Bem-vindo ao painel administrativo! Insira suas credenciais para continuar.</p>

            <div class="loading-spinner" id="loadingSpinner"></div>

            <label class="input-label">
                <i class="ri-user-line"></i>
                <span>Usuário</span>
            </label>
            <input type="text" id="username" placeholder="Digite o nome de usuário" v-model="username">

            <label class="input-label">
                <i class="ri-lock-line"></i>
                <span>Senha</span>
            </label>
            <div class="password-container">
                <input :type="passwordVisible ? 'text' : 'password'" id="password" placeholder="Digite a senha"
                    v-model="password" @keyup.enter="handleLogin">
                <button type="button" class="password-toggle-btn" :class="{ hidden: passwordVisible }"
                    @click="togglePasswordVisibility" :title="passwordVisible ? 'Ocultar senha' : 'Mostrar senha'">
                    <i :class="passwordVisible ? 'ri-eye-off-line' : 'ri-eye-line'"></i>
                </button>
            </div>

            <button class="button-entrar" id="btnEntrar" @click="handleLogin">Entrar</button>

            <div class="login-error" id="loginError"></div>
            <div class="returnhome">
                <a href="index.html" style=" font-size: 15px; text-decoration: none;"><i class="ri-arrow-left-line"></i>
                    Voltar para loja</a>
            </div>
        </main>
    </div>

    <script>
        const { createApp } = window.Vue;
        const { createClient } = window.supabase;

        createApp({
            data() {
                return {
                    username: '',
                    password: '',
                    passwordVisible: false,
                    isLoading: false,
                    loginError: '',
                    supabase: createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey)
                };
            },
            methods: {
                togglePasswordVisibility() {
                    this.passwordVisible = !this.passwordVisible;
                },
                async handleLogin() {
                    const username = this.username.trim();
                    const password = this.password.trim();

                    if (!username || !password) {
                        this.showError('Por favor, preencha todos os campos');
                        return;
                    }

                    this.isLoading = true;
                    this.loginError = '';
                    document.getElementById('loadingSpinner').style.display = 'block';
                    document.getElementById('btnEntrar').disabled = true;

                    try {
                        const { data, error } = await this.supabase.auth.signInWithPassword({
                            email: username,
                            password: password
                        });

                        if (error) {
                            this.showError('Credenciais inválidas. Tente novamente.');
                            console.error('Auth error:', error.message);
                        } else if (data.session) {
                            localStorage.setItem('adminToken', data.session.access_token);
                            localStorage.setItem('adminUser', JSON.stringify(data.user));
                            window.location.href = 'black-adm.html';
                        }
                    } catch (error) {
                        this.showError('Erro ao conectar. Tente novamente.');
                        console.error('Login error:', error);
                    } finally {
                        this.isLoading = false;
                        document.getElementById('loadingSpinner').style.display = 'none';
                        document.getElementById('btnEntrar').disabled = false;
                    }
                },
                showError(message) {
                    this.loginError = message;
                    document.getElementById('loginError').textContent = message;
                    document.getElementById('loginError').style.display = 'block';
                }
            },
            mounted() {
                this.supabase.auth.onAuthStateChange((event, session) => {
                    if (event === 'SIGNED_IN' && session) {
                        window.location.href = 'black-adm.html';
                    }
                });
            }
        }).mount('#app');
    </script>
</body>

</html>
